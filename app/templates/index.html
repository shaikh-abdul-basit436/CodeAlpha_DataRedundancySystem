<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Redundancy Removal System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container">

        <div class="header">
            <span class="badge">DATA QUALITY SYSTEM</span>
            <h1>Data Redundancy Removal System</h1>
            <p>Validate records, prevent duplicates, and maintain clean database data.</p>
        </div>

        <section class="card">
            <h2>Add New Record</h2>

            <form id="recordForm">
                <input id="unique_id" type="text" placeholder="Unique ID" required>
                <input id="name" type="text" placeholder="Name" required>
                <input id="email" type="email" placeholder="Email" required>
                <input id="phone" type="text" placeholder="Phone">

                <button type="submit">Submit Record</button>
            </form>

            <div id="result"></div>
        </section>

        <section class="records-section">
            <div class="records-header">
                <div>
                    <span class="badge">DATABASE</span>
                    <h2>Stored Records</h2>
                </div>

                <button id="refreshRecords" class="refresh-btn">
                    Refresh Records
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Unique ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Created At</th>
                        </tr>
                    </thead>

                    <tbody id="recordsTableBody">
                        <tr>
                            <td colspan="7" class="empty">
                                Loading records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
